<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANTUM V5 MICRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --neon-blue: #3b82f6;
            --neon-purple: #8b5cf6;
            --neon-green: #10b981;
            --neon-red: #ef4444;
        }

        body {
            background-color: #000;
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b, #000);
            color: #fff;
            font-family: 'Chakra Petch', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
        }

        /* MICRO WIDGET CONTAINER */
        .widget-container {
            width: 100%;
            max-width: 380px; /* Locked small size */
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: #a1a1aa;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            color: var(--neon-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .pulse {
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
            animation: blink 1s infinite;
        }

        /* Main Predictor Circle */
        .predictor-ring {
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            border: 1px solid var(--border);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.05);
        }

        .predictor-ring::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--neon-blue);
            border-bottom-color: var(--neon-purple);
            animation: spin 4s linear infinite;
        }

        .pred-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #71717a;
            margin-bottom: 5px;
        }

        .pred-value {
            font-size: 3.5rem;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 20px currentColor;
        }

        .BIG { color: var(--neon-blue); }
        .SMALL { color: var(--neon-purple); }

        .pred-conf {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            background: var(--glass);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-box {
            background: var(--glass);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .info-label { font-size: 0.7rem; color: #71717a; text-transform: uppercase; }
        .info-val { font-size: 1.1rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .timer-val { color: var(--neon-green); }

        /* History Dots */
        .history-track {
            display: flex;
            justify-content: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 16px;
            overflow: hidden;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .dot.B { background: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }
        .dot.S { background: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple); }

        /* Animations */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Logic Badge */
        .logic-badge {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            border: 1px solid var(--border);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.6rem;
            color: #a1a1aa;
            white-space: nowrap;
        }

    </style>
</head>
<body>

    <div class="widget-container">
        <div class="top-bar">
            <div style="font-weight: 700; letter-spacing: 1px;">QUANTUM <span style="color:var(--neon-blue)">V5</span></div>
            <div class="status-badge">
                <div class="pulse"></div>
                <span id="connectionStatus">ONLINE</span>
            </div>
        </div>

        <div class="predictor-ring">
            <div class="pred-label">Next Period</div>
            <div class="pred-value" id="predictionMain">---</div>
            <div class="pred-conf" id="confidenceDisp">0%</div>
            <div class="logic-badge" id="logicDisp">Waiting for data...</div>
        </div>

        <div class="info-grid">
            <div class="info-box">
                <div class="info-label">Current Period</div>
                <div class="info-val" id="periodDisp">Loading...</div>
            </div>
            <div class="info-box">
                <div class="info-label">Time Remaining</div>
                <div class="info-val timer-val" id="timerDisp">00:00</div>
            </div>
        </div>

        <div class="history-track" id="historyDots">
            </div>
    </div>

<script>
    // ===============================================
    // QUANTUM ENGINE V5.0 (FLUX ALGORITHM)
    // ===============================================
    const QUANTUM_V5 = {
        calculate: (history) => {
            if (history.length < 10) return { res: '---', conf: 0, logic: 'Initializing...' };

            const recent = history.slice(0, 10);
            const patterns = recent.map(h => h.resultType === 'BIG' ? 1 : 0); // 1=Big, 0=Small
            
            // 1. Calculate Trend Flux (Momentum)
            let momentum = 0;
            for(let i=0; i<5; i++) {
                momentum += (patterns[i] === patterns[0]) ? 1 : -1;
            }

            // 2. Pattern Matching
            let prediction = '';
            let confidence = 0;
            let logic = '';

            // Strategy A: Anti-Streak (If streak > 4)
            if (patterns[0] === patterns[1] && patterns[1] === patterns[2] && patterns[2] === patterns[3] && patterns[3] === patterns[4]) {
                prediction = patterns[0] === 1 ? 'SMALL' : 'BIG';
                confidence = 88;
                logic = 'Streak Break';
            }
            // Strategy B: 1-2-1 Pattern
            else if (patterns[0] !== patterns[1] && patterns[1] === patterns[2] && patterns[2] !== patterns[3]) {
                prediction = patterns[0] === 1 ? 'BIG' : 'SMALL'; // Continue the flip
                confidence = 75;
                logic = '1-2-1 Pattern';
            }
            // Strategy C: Flux Follower (Default)
            else {
                // If last 2 were different, predict last result (ZigZag)
                if (patterns[0] !== patterns[1]) {
                    prediction = patterns[0] === 1 ? 'SMALL' : 'BIG';
                    confidence = 65;
                    logic = 'ZigZag Flow';
                } else {
                    prediction = patterns[0] === 1 ? 'BIG' : 'SMALL';
                    confidence = 60;
                    logic = 'Trend Sustain';
                }
            }

            // Volatility Adjustment
            const bigs = recent.filter(x => x.resultType === 'BIG').length;
            if (bigs > 7 || bigs < 3) confidence += 10; // Market is biased, higher confidence

            return { res: prediction, conf: Math.min(confidence, 95), logic: logic };
        }
    };

    // ===============================================
    // API & SYSTEM (UNCHANGED)
    // ===============================================
    const CONFIG = {
        API: 'https://api.bdg88zf.com/api/webapi/GetGameIssue',
        HISTORY: 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json',
        REQ: {
            typeId: 1, language: 0, random: "e7fe6c090da2495ab8290dac551ef1ed",
            signature: "1F390E2B2D8A55D693E57FD905AE73A7", timestamp: 1723726679
        }
    };

    let state = { lastPeriod: '', history: [] };

    // Updates
    const updateUI = (pred, conf, logic, period, history) => {
        // Main Pred
        const pEl = document.getElementById('predictionMain');
        pEl.innerText = pred;
        pEl.className = `pred-value ${pred}`; // Adds color class
        
        document.getElementById('confidenceDisp').innerText = `${conf}% Confidence`;
        document.getElementById('logicDisp').innerText = `⚡ ${logic}`;
        document.getElementById('periodDisp').innerText = period;

        // History Dots
        const dotsHTML = history.slice(0, 12).map(h => 
            `<div class="dot ${h.resultType === 'BIG' ? 'B' : 'S'}"></div>`
        ).join('');
        document.getElementById('historyDots').innerHTML = dotsHTML;
    };

    // Data Fetcher
    const runSystem = async () => {
        try {
            // Fetch History
            const hRes = await fetch(`${CONFIG.HISTORY}?ts=${Date.now()}`);
            const hData = await hRes.json();
            const list = hData?.data?.list || [];
            
            const processed = list.map(i => ({
                period: i.issueNumber,
                resultType: parseInt(i.number) >= 5 ? 'BIG' : 'SMALL'
            }));

            // Fetch Current
            const cRes = await fetch(CONFIG.API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...CONFIG.REQ, timestamp: Math.floor(Date.now()/1000) })
            });
            const cData = await cRes.json();
            const curPeriod = cData?.data?.issueNumber;

            // Engine Logic
            if (curPeriod !== state.lastPeriod) {
                const prediction = QUANTUM_V5.calculate(processed);
                updateUI(prediction.res, prediction.conf, prediction.logic, curPeriod, processed);
                state.lastPeriod = curPeriod;
            }

        } catch (e) {
            console.log(e);
            document.getElementById('connectionStatus').innerText = 'RECONNECTING...';
            document.getElementById('connectionStatus').style.color = 'var(--neon-red)';
        }
    };

    // Timer
    setInterval(() => {
        const d = new Date();
        const s = 60 - d.getSeconds();
        document.getElementById('timerDisp').innerText = `00:${s.toString().padStart(2,'0')}`;
    }, 1000);

    setInterval(runSystem, 3000);
    runSystem();

</script>
</body>
</html>
