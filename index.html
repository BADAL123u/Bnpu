<body>
  <div class="container">
    <div class="wrapper">
      <svg><text x="50%" y="50%" dy=".35em" text-anchor="middle">BN LAST KING</text></svg>
    </div>

    <div class="card">
      <div class="period-label"><i class="fa-solid fa-calendar-days"></i> Period</div>
      <input type="text" id="periodDisplay" class="period-input" value="-" readonly />
      <div class="result-section">
        <span><i class="fa-solid fa-chart-bar"></i> Prediction</span>
        <span class="big-text" id="predictionDisplay">-</span>
        <span class="opposite-number" id="oppositeNumberDisplay">-</span>
        <div id="confidenceDisplay" style="font-size: 14px; margin-top: 5px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="dashboard-title">Analysis Dashboard</div>
      <div class="info-row">
        <span><i class="fa-solid fa-percent"></i> Win Rate</span>
        <span id="accuracy">0%</span>
      </div>
      <div class="info-row">
        <span><i class="fa-solid fa-trophy"></i> Wins</span>
        <span id="wins">0</span>
      </div>
      <div class="info-row">
        <span><i class="fa-solid fa-skull-crossbones"></i> Losses</span>
        <span id="losses">0</span>
      </div>
      <div class="info-row">
        <span><i class="fa-solid fa-chart-line"></i> Streak</span>
        <span id="streak">0</span>
      </div>
      <div class="info-row">
        <span><i class="fa-solid fa-brain"></i> AI Confidence</span>
        <span id="aiConfidence">0%</span>
      </div>
      <div class="info-row">
        <span><i class="fa-solid fa-server"></i> Server Status</span>
        <span class="connected">Connected</span>
      </div>
    </div>

    <div class="footer">TELEGRAM BN LAST KING HACK</div>
    <div class="history-title">History</div>
    <div id="historyContainer"></div>

    <!-- WIN sound -->
    <audio id="winSound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c09f0033d3.mp3?filename=success-1-6297.mp3"></audio>
  </div>

<script>
  let historyData = [];
  let lastFetchedPeriod = null;
  let lastResult = null;
  let lastPrediction = null;
  let lastStatus = null;
  let lastOppositeNumber = null;
  let globalPrediction = null;
  let streak = 0;
  let patternDatabase = [];
  let aiConfidence = 0;

  const backupHeaders = {
    "User-Agent": "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36",
    "Referer": "https://hgnice.biz"
  };

  // Enhanced Pattern Recognition
  class PatternAnalyzer {
    constructor() {
      this.patterns = [];
      this.sequenceLength = 5;
    }

    analyze(history) {
      if (history.length < this.sequenceLength) return null;
      
      const recent = history.slice(0, this.sequenceLength).map(h => ({
        result: h.result !== "-" ? (h.result >= 5 ? 'B' : 'S') : null,
        prediction: h.prediction === 'BIG' ? 'B' : 'S'
      })).filter(h => h.result !== null);

      if (recent.length < this.sequenceLength) return null;

      // Find similar patterns in history
      const currentPattern = recent.map(r => r.result).join('');
      let matches = [];

      for (let i = this.sequenceLength; i < history.length; i++) {
        const seq = history.slice(i, i + this.sequenceLength);
        if (seq.length < this.sequenceLength) break;
        
        const pattern = seq.map(s => s.result !== "-" ? (s.result >= 5 ? 'B' : 'S') : null).join('');
        if (pattern === currentPattern && i + this.sequenceLength < history.length) {
          const next = history[i + this.sequenceLength];
          if (next && next.result !== "-") {
            matches.push(next.result >= 5 ? 'B' : 'S');
          }
        }
      }

      return matches;
    }
  }

  // Advanced Neural Network Simulation
  class NeuralPredictor {
    constructor() {
      this.weights = {
        trend: 0.35,
        pattern: 0.30,
        randomness: 0.20,
        streak: 0.15
      };
    }

    predict(history, currentStreak) {
      if (history.length < 3) {
        return { prediction: Math.random() > 0.5 ? "BIG" : "SMALL", confidence: 50 };
      }

      // Analyze trends
      const validResults = history.filter(h => h.result !== "-");
      const lastResults = validResults.slice(0, 3).map(h => h.result);
      
      let trendScore = 0;
      let patternScore = 0;
      let randomnessScore = 0;
      
      // Trend analysis
      if (lastResults.length >= 2) {
        const changes = [];
        for (let i = 0; i < lastResults.length - 1; i++) {
          changes.push(lastResults[i] >= 5 ? 1 : -1);
        }
        trendScore = changes.reduce((a, b) => a + b, 0) / changes.length;
      }

      // Pattern analysis
      const patternAnalyzer = new PatternAnalyzer();
      const patternMatches = patternAnalyzer.analyze(validResults);
      if (patternMatches && patternMatches.length > 0) {
        const bigMatches = patternMatches.filter(m => m === 'B').length;
        const smallMatches = patternMatches.filter(m => m === 'S').length;
        patternScore = (bigMatches - smallMatches) / patternMatches.length;
      }

      // Randomness detection (anti-pattern)
      const variance = this.calculateVariance(lastResults);
      randomnessScore = Math.max(0.1, 1 - variance);

      // Streak adjustment
      const streakAdjustment = currentStreak > 2 ? -0.1 : (currentStreak < -2 ? 0.1 : 0);

      // Calculate final score
      const finalScore = 
        trendScore * this.weights.trend +
        patternScore * this.weights.pattern +
        randomnessScore * this.weights.randomness +
        streakAdjustment;

      // Calculate confidence
      const confidence = Math.min(95, Math.max(55, 
        60 + Math.abs(finalScore) * 25 + 
        (patternMatches ? patternMatches.length * 5 : 0)
      ));

      return {
        prediction: finalScore > 0 ? "BIG" : "SMALL",
        confidence: Math.round(confidence)
      };
    }

    calculateVariance(numbers) {
      if (numbers.length < 2) return 0;
      const mean = numbers.reduce((a, b) => a + b, 0) / numbers.length;
      const variance = numbers.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / numbers.length;
      return Math.sqrt(variance) / 4.5; // Normalize to 0-1 range
    }
  }

  // Markov Chain Predictor
  class MarkovPredictor {
    constructor() {
      this.transitions = {
        'B->B': 0, 'B->S': 0,
        'S->B': 0, 'S->S': 0
      };
      this.totalTransitions = 0;
    }

    update(history) {
      const validResults = history.filter(h => h.result !== "-");
      if (validResults.length < 2) return;
      
      for (let i = 0; i < validResults.length - 1; i++) {
        const current = validResults[i].result >= 5 ? 'B' : 'S';
        const next = validResults[i + 1].result >= 5 ? 'B' : 'S';
        const key = `${current}->${next}`;
        this.transitions[key] = (this.transitions[key] || 0) + 1;
        this.totalTransitions++;
      }
    }

    predict() {
      if (this.totalTransitions === 0) return { prediction: "BIG", probability: 0.5 };
      
      const lastResult = historyData.find(h => h.result !== "-");
      if (!lastResult) return { prediction: "BIG", probability: 0.5 };
      
      const lastState = lastResult.result >= 5 ? 'B' : 'S';
      const bProb = (this.transitions[`${lastState}->B`] || 0) / this.totalTransitions;
      const sProb = (this.transitions[`${lastState}->S`] || 0) / this.totalTransitions;
      
      return {
        prediction: bProb > sProb ? "BIG" : "SMALL",
        probability: Math.max(bProb, sProb)
      };
    }
  }

  // Initialize predictors
  const neuralPredictor = new NeuralPredictor();
  const markovPredictor = new MarkovPredictor();
  const patternAnalyzer = new PatternAnalyzer();

  function getOppositeNumber(prediction) {
    const small = [1, 2, 3, 4, 0];
    const big = [8, 9, 7, 6, 5];
    let arr = prediction === "BIG" ? small : big;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function advancedAIPredict() {
    // Update Markov chain
    markovPredictor.update(historyData.filter(h => h.result !== "-"));
    
    // Get predictions from all models
    const neuralPred = neuralPredictor.predict(historyData, streak);
    const markovPred = markovPredictor.predict();
    
    // Ensemble method - weighted average
    const neuralWeight = 0.65;
    const markovWeight = 0.35;
    
    let finalPrediction;
    let confidence;
    
    if (neuralPred.prediction === markovPred.prediction) {
      finalPrediction = neuralPred.prediction;
      confidence = Math.min(95, (neuralPred.confidence * neuralWeight + markovPred.probability * 100 * markovWeight));
    } else {
      // Use the one with higher confidence
      if (neuralPred.confidence > markovPred.probability * 100) {
        finalPrediction = neuralPred.prediction;
        confidence = neuralPred.confidence * 0.85;
      } else {
        finalPrediction = markovPred.prediction;
        confidence = markovPred.probability * 100 * 0.85;
      }
    }
    
    // Apply streak-based correction
    if (Math.abs(streak) >= 3) {
      finalPrediction = streak > 0 ? "SMALL" : "BIG";
      confidence = Math.max(60, confidence * 0.9);
    }
    
    return {
      prediction: finalPrediction,
      confidence: Math.round(confidence)
    };
  }

  function updateLastStatus(actualNumber) {
    const match = actualNumber == lastOppositeNumber || (actualNumber >= 5 ? 'BIG' : 'SMALL') === lastPrediction;
    lastResult = actualNumber >= 5 ? 'BIG' : 'SMALL';
    lastStatus = match ? 'WIN' : 'LOSS';

    // Update streak
    if (lastStatus === 'WIN') {
      streak = streak > 0 ? streak + 1 : 1;
      document.getElementById("winSound").play();
      alert("🎉 You WON this round!");
    } else {
      streak = streak < 0 ? streak - 1 : -1;
    }

    // Update AI confidence based on result
    if (lastStatus === 'WIN') {
      aiConfidence = Math.min(95, aiConfidence + 5);
    } else {
      aiConfidence = Math.max(40, aiConfidence - 10);
    }
  }

  async function fetchGameResult() {
    try {
      const ts = Date.now();
      const url = `https://draw.ar-lottery01.com/TrxWinGo/TrxWinGo_1M/GetHistoryIssuePage.json?ts={}}`;
      const response = await fetch(url, { headers: backupHeaders });
      const data = await response.json();

      if (data?.data?.list?.length > 0) {
        const latest = data.data.list[0];
        return {
          issueNumber: latest.issueNumber,
          number: latest.number
        };
      }
      return null;
    } catch (e) {
      console.error("API Error", e);
      return null;
    }
  }

  async function updatePrediction() {
    let result = await fetchGameResult();
    if (!result || result.issueNumber === lastFetchedPeriod) return;

    if (historyData.length > 0 && historyData[0].resultStatus === "Pending") {
      const actualNumber = Number(result.number);
      updateLastStatus(actualNumber);
      historyData[0].result = actualNumber;
      historyData[0].resultStatus = lastStatus;
    }

    // Get AI prediction with confidence
    const aiDecision = advancedAIPredict();
    lastPrediction = aiDecision.prediction;
    lastOppositeNumber = getOppositeNumber(lastPrediction);
    aiConfidence = aiDecision.confidence;
    globalPrediction = lastPrediction;

    let nextPeriodFull = (BigInt(result.issueNumber) + 1n).toString();
    let nextPeriod = nextPeriodFull.slice(-4);

    document.getElementById("periodDisplay").value = nextPeriod;
    document.getElementById("predictionDisplay").innerText = globalPrediction;
    document.getElementById("oppositeNumberDisplay").innerText = lastOppositeNumber;
    
    // Update confidence display
    const confidenceElement = document.getElementById("confidenceDisplay");
    let confidenceClass = "low-confidence";
    if (aiConfidence >= 75) confidenceClass = "high-confidence";
    else if (aiConfidence >= 60) confidenceClass = "medium-confidence";
    
    confidenceElement.innerHTML = `<span class="confidence-badge ${confidenceClass}">
      <i class="fa-solid fa-brain"></i> AI Confidence: ${aiConfidence}%
    </span>`;

    // Add to history
    historyData.unshift({
      period: nextPeriod,
      prediction: globalPrediction,
      oppositeNumber: lastOppositeNumber,
      result: "-",
      resultStatus: "Pending",
      confidence: aiConfidence
    });

    updateHistory();
    updateStats();
    lastFetchedPeriod = result.issueNumber;
  }

  function deleteHistory(index) {
    historyData.splice(index, 1);
    updateHistory();
    updateStats();
  }

  function updateHistory() {
    const container = document.getElementById("historyContainer");
    container.innerHTML = historyData.map((item, index) => {
      let color = item.resultStatus === "WIN" ? "green" : item.resultStatus === "LOSS" ? "red" : "yellow";
      let iconClass = item.resultStatus === "WIN" ? "fa-check-circle win-icon" :
                      item.resultStatus === "LOSS" ? "fa-xmark-circle loss-icon" :
                      "fa-spinner spinner";
      
      let confidenceBadge = "";
      if (item.confidence) {
        let confClass = "low-confidence";
        if (item.confidence >= 75) confClass = "high-confidence";
        else if (item.confidence >= 60) confClass = "medium-confidence";
        
        confidenceBadge = `<span class="confidence-badge ${confClass}">${item.confidence}%</span>`;
      }
      
      return `<div class="history-card ${color}">
        <div style="flex: 1;">
          <div><strong><i class="fa fa-calendar"></i> P-${item.period}</strong> ${confidenceBadge}</div>
          <div><i class="fa fa-chart-bar"></i> ${item.prediction} | <i class="fa fa-retweet"></i> ${item.oppositeNumber}</div>
          <div><i class="fa fa-dice"></i> ${item.result !== "-" ? item.result : "Waiting..."}</div>
        </div>
        <div class="history-actions">
          <i class="fa ${iconClass}"></i>
          <i class="fa-solid fa-trash-alt" onclick="deleteHistory(${index})"></i>
        </div>
      </div>`;
    }).join("");
  }

  function updateStats() {
    const wins = historyData.filter(item => item.resultStatus === "WIN").length;
    const losses = historyData.filter(item => item.resultStatus === "LOSS").length;
    const total = wins + losses;
    const accuracy = total > 0 ? ((wins / total) * 100).toFixed(2) : 0;
    
    document.getElementById("wins").textContent = wins;
    document.getElementById("losses").textContent = losses;
    document.getElementById("accuracy").textContent = `${accuracy}%`;
    document.getElementById("streak").textContent = streak > 0 ? `W${streak}` : `L${Math.abs(streak)}`;
    document.getElementById("aiConfidence").textContent = `${aiConfidence}%`;
  }

  // Initialize with faster updates
  setInterval(updatePrediction, 3000);
  updatePrediction(); // Initial call
</script>
</body>
